name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e . pytest ruff mypy

      - name: Run pytest
        run: pytest tests/ -x -q

      - name: Run ruff
        run: ruff check pipeline/

      - name: Run mypy
        run: mypy pipeline/ --ignore-missing-imports
